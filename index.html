<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الميراث الشرعي - حاسبة المواريث</title>
    
    <!-- SEO et métadonnées -->
    <meta name="description" content="حاسبة الميراث الشرعي الإسلامية - تطبيق جزائري لحساب المواريث بدقة">
    <meta name="keywords" content="ميراث, حساب الميراث, مواريث اسلامية, فقه المواريث">
    
    <!-- Open Graph pour les réseaux sociaux -->
    <meta property="og:title" content="حاسبة الميراث الشرعي">
    <meta property="og:description" content="تطبيق حساب الميراث الإسلامي بدقة">
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/2103/2103655.png">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
    
    <style>
        /* Reset et styles de base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Traditional Arabic', 'Amiri', 'Noto Naskh Arabic', system-ui, -apple-system, sans-serif;
            background: #0d3d4e;
            min-height: 100vh;
            direction: rtl;
            overflow: hidden; /* Empêche le scroll pendant le chargement */
        }
        
        /* Écran de chargement */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d3d4e;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        
        .loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-content {
            text-align: center;
            color: #d4af37;
            max-width: 500px;
            padding: 20px;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top-color: #d4af37;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-title {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #d4af37;
        }
        
        .loading-text {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 10px;
        }
        
        /* Message d'erreur */
        .error-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d3d4e;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        .error-screen.show {
            display: flex;
        }
        
        .error-content {
            text-align: center;
            color: white;
            max-width: 500px;
            padding: 20px;
        }
        
        .error-title {
            font-size: 2rem;
            color: #d4af37;
            margin-bottom: 20px;
        }
        
        .error-message {
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .error-button {
            display: inline-block;
            background: #d4af37;
            color: #0d3d4e;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .error-button:hover {
            background: #e5c04b;
            transform: scale(1.05);
        }
        
        /* Iframe principal */
        #main-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 1;
        }
        
        #main-frame.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Écran de chargement -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <div class="spinner"></div>
            <h1 class="loading-title">حاسبة الميراث الشرعي</h1>
            <p class="loading-text">جاري تحميل التطبيق...</p>
            <p class="loading-text" style="font-size: 0.9rem; opacity: 0.7;">يرجى الانتظار قليلاً</p>
        </div>
    </div>
    
    <!-- Écran d'erreur -->
    <div class="error-screen" id="errorScreen">
        <div class="error-content">
            <h2 class="error-title">عذراً</h2>
            <p class="error-message">حدث خطأ في تحميل التطبيق. يمكنك المحاولة مرة أخرى أو الانتقال مباشرة إلى التطبيق.</p>
            <a href="https://www.cwoste-sba.dz/mirath/" class="error-button" target="_blank" rel="noopener noreferrer">انتقال مباشر</a>
        </div>
    </div>
    
    <!-- Iframe qui charge le contenu cible -->
    <iframe id="main-frame" src="https://www.cwoste-sba.dz/mirath/" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-top-navigation" allow="fullscreen"></iframe>

    <script>
        (function() {
            'use strict';
            
            const TARGET_URL = 'https://www.cwoste-sba.dz/mirath/';
            const TIMEOUT = 8000; // 8 secondes
            
            const loadingScreen = document.getElementById('loadingScreen');
            const errorScreen = document.getElementById('errorScreen');
            const mainFrame = document.getElementById('main-frame');
            
            let loadSuccessful = false;
            let timeoutId = null;
            
            // Fonction pour afficher le contenu avec l'URL masquée
            function showContent() {
                if (loadSuccessful) return;
                loadSuccessful = true;
                
                if (timeoutId) clearTimeout(timeoutId);
                
                // Cacher l'écran de chargement
                loadingScreen.classList.add('fade-out');
                
                // Afficher l'iframe
                mainFrame.classList.add('visible');
                
                // Nettoyer l'URL dans l'historique (optionnel)
                if (window.history && history.replaceState) {
                    history.replaceState({}, document.title, '/mirath/');
                }
            }
            
            // Fonction pour afficher l'erreur
            function showError() {
                if (loadSuccessful) return;
                
                loadingScreen.classList.add('fade-out');
                errorScreen.classList.add('show');
            }
            
            // Gestionnaire de chargement de l'iframe
            mainFrame.onload = function() {
                try {
                    // Essayer d'accéder au contenu de l'iframe
                    const iframeDoc = mainFrame.contentDocument || mainFrame.contentWindow.document;
                    
                    // Vérifier si le contenu est valide
                    if (iframeDoc.body && iframeDoc.body.innerHTML.length > 200) {
                        showContent();
                    } else {
                        // Contenu trop court, probablement une erreur
                        console.warn('Contenu de l\'iframe trop court');
                        setTimeout(showError, 1000);
                    }
                } catch (e) {
                    // Erreur CORS - souvent signe que l'iframe a bien chargé
                    console.log('Erreur CORS ignorée, contenu probablement chargé');
                    showContent();
                }
            };
            
            // Gestionnaire d'erreur de l'iframe
            mainFrame.onerror = function() {
                console.error('Erreur de chargement de l\'iframe');
                showError();
            };
            
            // Timeout de sécurité
            timeoutId = setTimeout(function() {
                if (!loadSuccessful) {
                    console.warn('Timeout de chargement atteint');
                    showError();
                }
            }, TIMEOUT);
            
            // Intercepter les clics sur les liens pour rester dans l'iframe
            window.addEventListener('load', function() {
                try {
                    const iframeWindow = mainFrame.contentWindow;
                    
                    if (iframeWindow) {
                        iframeWindow.addEventListener('click', function(e) {
                            const links = iframeWindow.document.querySelectorAll('a');
                            links.forEach(link => {
                                link.addEventListener('click', function(event) {
                                    const href = this.getAttribute('href');
                                    
                                    // Ne pas intercepter les liens externes
                                    if (href && href.startsWith('http') && !href.includes('cwoste-sba.dz')) {
                                        return;
                                    }
                                    
                                    event.preventDefault();
                                    
                                    if (href && !href.startsWith('#')) {
                                        if (href.startsWith('http')) {
                                            // Lien absolu vers le même domaine
                                            if (href.includes('cwoste-sba.dz')) {
                                                mainFrame.src = href;
                                            } else {
                                                window.open(href, '_blank');
                                            }
                                        } else {
                                            // Lien relatif
                                            const base = TARGET_URL.endsWith('/') ? TARGET_URL : TARGET_URL + '/';
                                            mainFrame.src = base + href.replace(/^\//, '');
                                        }
                                    }
                                });
                            });
                        });
                    }
                } catch (e) {
                    // Ignorer les erreurs CORS
                    console.log('Impossible d\'intercepter les liens dans l\'iframe');
                }
            });
            
            // Préchargement du contenu
            if (window.fetch) {
                fetch(TARGET_URL, { 
                    mode: 'no-cors',
                    cache: 'force-cache'
                }).catch(() => {
                    // Ignorer les erreurs CORS
                });
            }
            
            // Nettoyer l'URL au chargement
            if (window.history && history.replaceState) {
                history.replaceState({}, document.title, '/mirath/');
            }
            
        })();
    </script>
    
    <!-- Fallback pour les très vieux navigateurs -->
    <noscript>
        <meta http-equiv="refresh" content="0;url=https://www.cwoste-sba.dz/mirath/">
    </noscript>
</body>
</html>
