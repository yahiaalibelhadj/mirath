<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الميراث الشرعي - حاسبة المواريث</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <meta name="description" content="حاسبة الميراث الشرعي الإسلامية">
    <meta name="keywords" content="ميراث, حساب الميراث, مواريث اسلامية">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0d3d4e;
            font-family: 'Traditional Arabic', 'Amiri', 'Noto Naskh Arabic', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
        }
        
        /* Loader */
        .loader-container {
            text-align: center;
            color: #d4af37;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(212, 175, 55, 0.2);
            border-top-color: #d4af37;
            border-radius: 50%;
            margin: 20px auto;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Iframe cachée */
        #content-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            z-index: 1;
        }
        
        #content-frame.visible {
            opacity: 1;
            visibility: visible;
        }
        
        /* Message d'erreur */
        .error-message {
            color: white;
            text-align: center;
            display: none;
            padding: 20px;
        }
        
        .error-message a {
            color: #d4af37;
            text-decoration: none;
        }
        
        .error-message a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div class="loader-container" id="loader">
        <div class="spinner"></div>
        <p>جاري تحميل حاسبة الميراث...</p>
    </div>
    
    <!-- Message d'erreur (caché par défaut) -->
    <div class="error-message" id="error-message">
        <h2 style="color: #d4af37;">عذراً</h2>
        <p>حدث خطأ في تحميل التطبيق</p>
        <p><a href="https://cwoste-sba.dz/mirath" target="_blank">انقر هنا للذهاب مباشرة</a></p>
    </div>
    
    <!-- Iframe qui chargera le contenu silencieusement -->
    <iframe id="content-frame" src="https://cwoste-sba.dz/mirath" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-top-navigation"></iframe>

    <script>
        // Configuration
        const TARGET_URL = "https://cwoste-sba.dz/mirath";
        const LOAD_TIMEOUT = 8000; // 8 secondes max
        
        const iframe = document.getElementById('content-frame');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('error-message');
        
        let loadStarted = false;
        
        // Fonction pour afficher l'iframe
        function showIframe() {
            iframe.classList.add('visible');
            loader.style.display = 'none';
            // Modifier l'URL sans recharger la page
            history.replaceState({}, '', '/');
        }
        
        // Fonction pour gérer l'erreur
        function showError() {
            if (!loadStarted) return;
            loader.style.display = 'none';
            errorMsg.style.display = 'block';
        }
        
        // Vérifier si le chargement est réussi
        iframe.onload = function() {
            try {
                // Tenter d'accéder au contenu de l'iframe
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                
                // Vérifier si le contenu est valide (pas d'erreur 404, etc.)
                if (iframeDoc.body && iframeDoc.body.innerHTML.length > 100) {
                    showIframe();
                } else {
                    showError();
                }
            } catch (e) {
                // Erreur CORS, mais souvent ça veut dire que l'iframe a bien chargé
                showIframe();
            }
        };
        
        // Erreur de chargement
        iframe.onerror = showError;
        
        // Timeout de sécurité
        setTimeout(() => {
            if (!iframe.classList.contains('visible')) {
                showError();
            }
        }, LOAD_TIMEOUT);
        
        // Alternative : Fetch API pour les navigateurs modernes
        if (window.fetch) {
            fetch(TARGET_URL, { mode: 'no-cors' })
                .then(() => {
                    // Si fetch réussit, on peut commencer le chargement
                    loadStarted = true;
                })
                .catch(() => {
                    // Ignorer les erreurs CORS
                    loadStarted = true;
                });
        } else {
            loadStarted = true;
        }
        
        // Redirection au clic sur le document (fallback)
        document.body.addEventListener('click', function(e) {
            // Éviter la redirection si on clique dans l'iframe
            if (e.target.closest('iframe')) return;
            
            if (!iframe.classList.contains('visible')) {
                window.location.href = TARGET_URL;
            }
        }, true);
        
        // Gérer les liens dans l'iframe pour qu'ils restent dans l'iframe
        window.addEventListener('load', function() {
            try {
                const iframeWindow = iframe.contentWindow;
                iframeWindow.addEventListener('click', function(e) {
                    const links = iframeWindow.document.querySelectorAll('a');
                    links.forEach(link => {
                        link.addEventListener('click', function(event) {
                            event.preventDefault();
                            const href = this.getAttribute('href');
                            if (href && !href.startsWith('#')) {
                                if (href.startsWith('http')) {
                                    iframe.src = href;
                                } else {
                                    const base = TARGET_URL.endsWith('/') ? TARGET_URL : TARGET_URL + '/';
                                    iframe.src = base + href.replace(/^\//, '');
                                }
                            }
                        });
                    });
                });
            } catch (e) {
                // Ignorer les erreurs CORS
            }
        });
        
        // Nettoyer l'URL dans l'historique
        if (window.history && history.replaceState) {
            history.replaceState({}, '', '/');
        }
    </script>
</body>
</html>
