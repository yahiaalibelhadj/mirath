<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirath - Redirection</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            margin: 20px;
            color: #333;
        }
        h1 {
            color: #764ba2;
            margin-bottom: 20px;
            font-size: 2em;
        }
        .message {
            font-size: 1.2em;
            margin: 20px 0;
            line-height: 1.6;
            color: #555;
        }
        .countdown {
            font-size: 3em;
            font-weight: bold;
            color: #764ba2;
            margin: 20px 0;
        }
        .link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 25px;
            margin-top: 20px;
            transition: transform 0.3s;
        }
        .link:hover {
            transform: scale(1.05);
        }
        .small {
            font-size: 0.9em;
            color: #888;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 Mirath</h1>
        <div class="message">
            Le site a été déplacé vers :<br>
            <strong style="color: #764ba2;">cwoste-sba.dz/mirath</strong>
        </div>
        
        <div class="countdown" id="countdown">5</div>
        
        <div class="message">
            Redirection automatique dans <span id="seconds">5</span> secondes...
        </div>
        
        <a href="https://www.cwoste-sba.dz/mirath/" class="link">
            Cliquez ici si vous n'êtes pas redirigé
        </a>
        
        <div class="small">
            ⚡ Vous serez redirigé automatiquement
        </div>
    </div>

    <script>
        // Compte à rebours
        let seconds = 5;
        const countdownEl = document.getElementById('countdown');
        const secondsEl = document.getElementById('seconds');
        
        const interval = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            secondsEl.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = "https://www.cwoste-sba.dz/mirath/";
            }
        }, 1000);
    </script>
</body>
</html>
